# Render Infrastructure as Code (Blueprint)
# Deploy all 3 services with one click from GitHub

services:
  # 1. Python ML & Liveness Microservice
  - type: web
    name: mindpulse-ml-service
    env: docker
    dockerfilePath: ml-service/Dockerfile
    dockerContext: ml-service
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5001
      - key: FLASK_ENV
        value: production

  # 2. Node.js Backend API
  - type: web
    name: mindpulse-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: mindpulse-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: mindpulse-ml-service
          property: host

  # 3. React Vite Frontend
  - type: web
    name: mindpulse-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: mindpulse-backend
          property: host
      - key: VITE_ML_SERVICE_URL
        fromService:
          type: web
          name: mindpulse-ml-service
          property: host
