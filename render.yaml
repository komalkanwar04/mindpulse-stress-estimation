# Render Infrastructure as Code (Blueprint) - 100% Free Tier Compatible
services:
  # 1. Python ML & Liveness Microservice
  - type: web
    name: mindpulse-stress-estimation-ml
    env: docker
    dockerfilePath: ml-service/Dockerfile
    dockerContext: ml-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health

  # 2. Node.js Backend API
  - type: web
    name: mindpulse-stress-estimation-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: mindpulse-stress-estimation-ml
          property: host

  # 3. React Vite Frontend
  - type: web
    name: mindpulse-stress-estimation-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: mindpulse-stress-estimation-backend
          property: host
      - key: VITE_ML_SERVICE_URL
        fromService:
          type: web
          name: mindpulse-stress-estimation-ml
          property: host
