version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: mindpulse-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
    networks:
      - mindpulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindpulse-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:5001
    volumes:
      - backend-data:/app/data
    depends_on:
      - ml-service
    networks:
      - mindpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:4000
        - VITE_ML_SERVICE_URL=http://localhost:5001
    container_name: mindpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ml-service
    networks:
      - mindpulse-network

networks:
  mindpulse-network:
    driver: bridge

volumes:
  backend-data:
